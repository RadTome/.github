<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090f"/>
      <stop offset="50%" stop-color="#0e0e18"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Neon Flame Accent Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffc83b"/>
      <stop offset="45%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff3b00"/>
    </linearGradient>

    <!-- Cyan Highlight Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff8c00" stroke-width="0.75" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Chassis -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Outer Neon Border Frame -->
  <rect x="2" y="2" width="1196" height="316" rx="15" fill="none" stroke="url(#flameGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Perspective Floor Lines (Tron Aesthetic) -->
  <g opacity="0.25" stroke="#ff8c00" stroke-width="1">
    <line x1="0" y1="280" x2="1200" y2="280" stroke-opacity="0.6"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke-opacity="0.8"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke-opacity="1"/>
    <!-- Perspective convergence rays -->
    <line x1="600" y1="240" x2="100" y2="320"/>
    <line x1="600" y1="240" x2="250" y2="320"/>
    <line x1="600" y1="240" x2="400" y2="320"/>
    <line x1="600" y1="240" x2="520" y2="320"/>
    <line x1="600" y1="240" x2="600" y2="320"/>
    <line x1="600" y1="240" x2="680" y2="320"/>
    <line x1="600" y1="240" x2="800" y2="320"/>
    <line x1="600" y1="240" x2="950" y2="320"/>
    <line x1="600" y1="240" x2="1100" y2="320"/>
  </g>

  <!-- Corner Tech Accents -->
  <g fill="#ffb020" opacity="0.8">
    <polygon points="12,12 28,12 28,15 15,15 15,28 12,28"/>
    <polygon points="1188,12 1172,12 1172,15 1185,15 1185,28 1188,28"/>
    <polygon points="12,308 28,308 28,305 15,305 15,292 12,292"/>
    <polygon points="1188,308 1172,308 1172,305 1185,305 1185,292 1188,292"/>
  </g>

  <!-- Top System Status Badges -->
  <g transform="translate(80, 42)">
    <!-- Pill 1: Status -->
    <rect x="0" y="0" width="190" height="24" rx="12" fill="#141422" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="12" r="4" fill="#00ff66" filter="url(#subtleGlow)"/>
    <text x="26" y="16" class="mono" font-size="10.5" font-weight="700" fill="#00f0ff" letter-spacing="1">FORGE STATUS: ONLINE</text>

    <!-- Pill 2: Mission -->
    <rect x="202" y="0" width="220" height="24" rx="12" fill="#141422" stroke="#ff8c00" stroke-width="1" stroke-opacity="0.3"/>
    <text x="214" y="16" class="mono" font-size="10.5" font-weight="600" fill="#ffb020" letter-spacing="0.5">SYS://RADTOME.ORG/FORGE</text>

    <!-- Pill 3: Location -->
    <rect x="434" y="0" width="165" height="24" rx="12" fill="#141422" stroke="#7000ff" stroke-width="1" stroke-opacity="0.3"/>
    <text x="446" y="16" class="mono" font-size="10.5" font-weight="600" fill="#c084fc" letter-spacing="0.5">MEMPHIS, TN  USA</text>
  </g>

  <!-- Main Identity Section -->
  <g transform="translate(80, 85)">
    <!-- Shield Logo Icon -->
    <g transform="translate(0, 5)">
      <!-- Squircle Chassis -->
      <rect x="0" y="0" width="110" height="110" rx="26" fill="#0c0c16" stroke="url(#flameGrad)" stroke-width="3" filter="url(#subtleGlow)"/>
      
      <!-- Inner grid floor -->
      <g opacity="0.35" stroke="#ff8c00" stroke-width="0.9">
        <line x1="8" y1="80" x2="102" y2="80"/>
        <line x1="12" y1="92" x2="98" y2="92"/>
        <line x1="55" y1="80" x2="25" y2="104"/>
        <line x1="55" y1="80" x2="42" y2="104"/>
        <line x1="55" y1="80" x2="55" y2="104"/>
        <line x1="55" y1="80" x2="68" y2="104"/>
        <line x1="55" y1="80" x2="85" y2="104"/>
      </g>

      <!-- Glowing "R" Glyph -->
      <path fill-rule="evenodd"
            d="M 28 24 
               L 64 24 
               C 78 24, 87 31, 87 45 
               C 87 56, 79 63, 67 65 
               L 86 88 
               L 71 88 
               L 54 67 
               L 43 67 
               L 43 88 
               L 28 88 
               Z 
               M 43 37 
               L 43 54 
               L 61 54 
               C 69 54, 73 50, 73 45 
               C 73 40, 69 37, 61 37 
               Z" 
            fill="url(#flameGrad)" 
            filter="url(#glow)"/>
      <polygon points="90,6 104,20 104,6" fill="#ffb020" opacity="0.85"/>
    </g>

    <!-- Wordmark & Typography -->
    <g transform="translate(140, 10)">
      <!-- Organization Title -->
      <text x="0" y="58" class="sans" font-size="62" font-weight="900" fill="url(#flameGrad)" letter-spacing="4" filter="url(#subtleGlow)">RADTOME</text>
      
      <!-- Version & Badge -->
      <rect x="365" y="16" width="96" height="26" rx="6" fill="#ffb020" fill-opacity="0.15" stroke="#ffb020" stroke-width="1.2"/>
      <text x="377" y="34" class="mono" font-size="12" font-weight="800" fill="#ffc83b">ORG FORGE</text>

      <!-- Subtitle -->
      <text x="2" y="90" class="mono" font-size="14.5" font-weight="700" fill="#e2e8f0" letter-spacing="3.5">
        THE DEFINITIVE BLUEPRINT FOR MODERN ENTERPRISE SYSTEMS
      </text>

      <!-- Core Description / Sub-headline -->
      <text x="2" y="116" class="sans" font-size="13.5" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
        High-Utility Developer Tooling  •  GraalVM Native Microservices  •  Model Context Protocol (MCP) Infrastructure
      </text>
    </g>
  </g>

  <!-- Bottom Interactive Tech Pillars (Pill Badges) -->
  <g transform="translate(80, 240)">
    <!-- Card 1: OrgSets -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="8" fill="#12121f" stroke="#ffb020" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="18" cy="18" r="4.5" fill="#ffb020"/>
      <text x="32" y="17" class="sans" font-size="12" font-weight="700" fill="#ffffff">OrgSets.com</text>
      <text x="32" y="28" class="mono" font-size="8.5" fill="#94a3b8">Multi-Tenant SaaS</text>
    </g>

    <!-- Card 2: QuickSnipe -->
    <g transform="translate(192, 0)">
      <rect width="180" height="36" rx="8" fill="#12121f" stroke="#00ff66" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="18" cy="18" r="4.5" fill="#00ff66"/>
      <text x="32" y="17" class="sans" font-size="12" font-weight="700" fill="#ffffff">QuickSnipe MV3</text>
      <text x="32" y="28" class="mono" font-size="8.5" fill="#94a3b8">AI Listing Studio</text>
    </g>

    <!-- Card 3: Surface Codex -->
    <g transform="translate(384, 0)">
      <rect width="195" height="36" rx="8" fill="#12121f" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="18" cy="18" r="4.5" fill="#00f0ff"/>
      <text x="32" y="17" class="sans" font-size="12" font-weight="700" fill="#ffffff">Surface Codex</text>
      <text x="32" y="28" class="mono" font-size="8.5" fill="#94a3b8">Security Intelligence MCP</text>
    </g>

    <!-- Card 4: MCP Codex -->
    <g transform="translate(591, 0)">
      <rect width="180" height="36" rx="8" fill="#12121f" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="18" cy="18" r="4.5" fill="#c084fc"/>
      <text x="32" y="17" class="sans" font-size="12" font-weight="700" fill="#ffffff">MCP Codex</text>
      <text x="32" y="28" class="mono" font-size="8.5" fill="#94a3b8">Agent Tool Directory</text>
    </g>

    <!-- Card 5: PrettyPrint -->
    <g transform="translate(783, 0)">
      <rect width="165" height="36" rx="8" fill="#12121f" stroke="#ff6b35" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="18" cy="18" r="4.5" fill="#ff6b35"/>
      <text x="32" y="17" class="sans" font-size="12" font-weight="700" fill="#ffffff">PrettyPrint</text>
      <text x="32" y="28" class="mono" font-size="8.5" fill="#94a3b8">Zero-Telemetry AST</text>
    </g>

    <!-- Card 6: preshow.date -->
    <g transform="translate(960, 0)">
      <rect width="160" height="36" rx="8" fill="#12121f" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="18" cy="18" r="4.5" fill="#38bdf8"/>
      <text x="32" y="17" class="sans" font-size="12" font-weight="700" fill="#ffffff">preshow.date</text>
      <text x="32" y="28" class="mono" font-size="8.5" fill="#94a3b8">Next 16 + Workers</text>
    </g>
  </g>
</svg>
