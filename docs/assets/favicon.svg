<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0f16"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff2200"/>
    </linearGradient>

    <!-- R Glyph Neon Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc83b"/>
      <stop offset="45%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>

    <!-- Soft Glow Filter for High-DPI Displays -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Squircle Chassis -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Perspective Tron Wireframe Floor in Base -->
  <g opacity="0.38" stroke="#ff6b35" stroke-width="0.8">
    <line x1="4" y1="44" x2="60" y2="44" stroke="#ffb020" stroke-width="1.2" opacity="0.75"/>
    <line x1="6" y1="50" x2="58" y2="50"/>
    <line x1="4" y1="56" x2="60" y2="56"/>
    <!-- Perspective convergence lines -->
    <line x1="32" y1="44" x2="12" y2="60"/>
    <line x1="32" y1="44" x2="22" y2="60"/>
    <line x1="32" y1="44" x2="32" y2="60"/>
    <line x1="32" y1="44" x2="42" y2="60"/>
    <line x1="32" y1="44" x2="52" y2="60"/>
  </g>

  <!-- Glowing 80s Cyber "R" Mark -->
  <path fill-rule="evenodd"
        d="M 17 14 
           L 36 14 
           C 44 14, 49 18, 49 26 
           C 49 32, 45 36, 38 37 
           L 49 50 
           L 40 50 
           L 30.5 38 
           L 25 38 
           L 25 50 
           L 17 50 
           Z 
           M 25 21 
           L 25 31 
           L 35 31 
           C 39 31, 41 29, 41 26 
           C 41 23, 39 21, 35 21 
           Z" 
        fill="url(#glyphGrad)" 
        filter="url(#neonGlow)"/>

  <!-- 80s Corner Tech Stencil Cutout -->
  <polygon points="50,4 58,12 58,4" fill="#ffb020" opacity="0.85"/>
</svg>
